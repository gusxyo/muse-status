<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>muse-vm 实时监控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #e6edf3; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 20px 16px 40px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
  .hero { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 10px #3fb950; flex-shrink: 0; }
  .dot.off { background: #f85149; box-shadow: 0 0 10px #f85149; }
  .hero .name { font-size: 20px; font-weight: 700; }
  .badge { background: #1a3a24; color: #3fb950; border-radius: 20px; padding: 4px 14px; font-size: 13px; margin-left: auto; white-space: nowrap; }
  .badge.off { background: #3a1a1a; color: #f85149; }
  .badge.stale { background: #3a2f1a; color: #d29922; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 16px; }
  .card .label { color: #8b949e; font-size: 13px; margin-bottom: 8px; }
  .card .val { font-size: 21px; font-weight: 700; margin-bottom: 10px; }
  .card .val small { font-size: 13px; color: #8b949e; font-weight: 400; }
  .bar { height: 8px; background: #30363d; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #58a6ff; border-radius: 4px; transition: width .5s; }
  .wide { grid-column: 1 / -1; }
  .foot { color: #8b949e; font-size: 12px; text-align: center; margin-top: 20px; line-height: 1.8; }
  #err { display: none; background: #3a1a1a; color: #f85149; border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 14px; }
</style>
</head>
<body>
<h1>🖥️ muse-vm 实时监控</h1>
<div class="sub" id="updated">正在加载…</div>
<div id="err"></div>
<div class="hero">
  <div class="dot" id="dot"></div>
  <div class="name">muse-vm</div>
  <div class="badge" id="badge">…</div>
</div>
<div class="grid">
  <div class="card"><div class="label">CPU 使用率</div><div class="val" id="cpu">–</div><div class="bar"><i id="cpuBar"></i></div></div>
  <div class="card"><div class="label">内存</div><div class="val" id="mem">–</div><div class="bar"><i id="memBar"></i></div></div>
  <div class="card"><div class="label">硬盘</div><div class="val" id="disk">–</div><div class="bar"><i id="diskBar"></i></div></div>
  <div class="card"><div class="label">系统负载</div><div class="val" id="load">–</div><div class="bar"><i id="loadBar" style="background:#d29922"></i></div></div>
  <div class="card wide"><div class="label">节点信息</div><div class="val" style="font-size:15px;font-weight:400;line-height:1.9" id="info">–</div></div>
</div>
<div class="foot" id="foot">数据每分钟更新 · 页面每 15 秒自动刷新</div>
<script>
const gb = b => (b / 1073741824).toFixed(1);
async function tick() {
  try {
    const r = await fetch('metrics.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const m = await r.json();
    document.getElementById('err').style.display = 'none';
    const age = Math.round(Date.now()/1000 - m.ts);
    const stale = age > 150;
    const dot = document.getElementById('dot'), badge = document.getElementById('badge');
    dot.className = 'dot' + ((!m.online || stale) ? ' off' : '');
    badge.className = 'badge' + (!m.online ? ' off' : (stale ? ' stale' : ''));
    badge.textContent = !m.online ? '离线' : (stale ? '数据过期' : '在线');
    document.getElementById('cpu').textContent = m.cpu.toFixed(1) + '%';
    document.getElementById('cpuBar').style.width = Math.min(m.cpu,100) + '%';
    document.getElementById('mem').innerHTML = gb(m.mem_used) + ' <small>/ ' + gb(m.mem_total) + ' GB</small>';
    document.getElementById('memBar').style.width = (m.mem_used/m.mem_total*100) + '%';
    document.getElementById('disk').innerHTML = gb(m.disk_used) + ' <small>/ ' + gb(m.disk_total) + ' GB</small>';
    document.getElementById('diskBar').style.width = (m.disk_used/m.disk_total*100) + '%';
    document.getElementById('load').textContent = m.load + ' · ' + m.uptime;
    document.getElementById('loadBar').style.width = Math.min(parseFloat(m.load)/2*100,100) + '%';
    document.getElementById('info').innerHTML =
      m.os + ' · ' + m.arch + '<br>CPU ' + m.cpu_name + ' · ' + m.cpu_cores + ' 核<br>' +
      'Agent v' + m.agent_version + ' · 已运行 ' + m.uptime;
    const t = new Date(m.ts*1000);
    document.getElementById('updated').textContent =
      '数据更新于 ' + t.toLocaleString('zh-CN', {hour12:false}) + '（' + age + ' 秒前）';
  } catch(e) {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = '拉取数据失败：' + e.message + '，稍后自动重试';
  }
}
tick(); setInterval(tick, 15000);
</script>
</body>
</html>
